spring.application.name=iron-empire-backend

# Configuración de la bd.
# ${VARIABLE:defecto} --> Si existe, inyectá su valor, si no, usá el valor que está después de los dos puntos.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iron_empire_bd}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:contra}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

admin.general.nombre=${ADMIN_NOMBRE:Admin}
admin.general.apellido=${ADMIN_APELLIDO:General}
admin.general.dni=${ADMIN_DNI:00000000}
admin.general.email=${ADMIN_EMAIL:admin@ironempire.com}
admin.general.telefono=${ADMIN_TELEFONO:0000000000}
admin.general.contrasenia=${ADMIN_CONTRASENIA:admin123}

jwt.secreto=Y2xhdmU5MTIxOGJpZW5MYXJnYVBhcmFRdWVOb01lVGlyZUV4Y2VwY2lvbmVz
jwt.expiracion=3600000

minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:ironempire_admin}
minio.secret-key=${MINIO_SECRET_KEY:admin12345}
minio.bucket=${MINIO_BUCKET:iron-empire-bucket}
# Tamaño máximo permitido para un único archivo dentro de la petición.
spring.servlet.multipart.max-file-size=5MB
# Tamaño total de toda la petición HTTP. Suma todos los archivos enviados juntos más los campos de texto del formulario.
spring.servlet.multipart.max-request-size=10MB
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

gym.mail.remitente=${MAIL_REMITENTE:no-reply@ironempiregym.com}
